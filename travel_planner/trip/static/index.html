<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سفرپلنر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f7f8; --surface: #ffffff; --surface-2: #eef2f3; --border: #dfe5e8;
    --text: #1b2428; --muted: #62717a; --accent: #0f8a7e; --accent-soft: #e2f4f1;
    --ok: #12805c; --warn: #b54708; --warn-soft: #fff4e5; --danger: #c4320a; --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1416; --surface: #182024; --surface-2: #212b30; --border: #2c383e;
      --text: #e6eef0; --muted: #98a8b0; --accent: #3cc7b6; --accent-soft: #163a37;
      --ok: #4cc79a; --warn: #f5a35c; --warn-soft: #3a2a17; --danger: #ff7a59;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Vazirmatn, Tahoma, sans-serif; font-size: 15px; line-height: 1.7; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
  .bar { padding: 14px 0; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .logo { font-weight: 700; font-size: 21px; } .logo span { color: var(--accent); }
  main { padding: 24px 0 64px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
  h2 { font-size: 17px; margin: 0 0 16px; } h3 { font-size: 15px; margin: 0 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input[type=text], select { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; }
  input:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .ltr { direction: ltr; text-align: left; }
  .date { display: grid; grid-template-columns: 0.8fr 1.3fr 1fr; gap: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px; cursor: pointer; font-size: 14px; }
  .chip:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .chip input { accent-color: var(--accent); margin: 0; }
  .btn { border: 0; background: var(--accent); color: #fff; padding: 10px 24px; border-radius: 8px; font: inherit; font-weight: 500; cursor: pointer; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .hint { font-size: 13px; color: var(--muted); }
  .gap { margin-top: 16px; }
  .err { color: var(--danger); font-size: 14px; white-space: pre-wrap; }
  .banner { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; font-size: 14px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 12px 0 16px; }
  .tabs button { border: 0; background: transparent; color: var(--muted); padding: 7px 14px; border-radius: 8px; font: inherit; cursor: pointer; }
  .tabs button.active { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .dest { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .dest-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .dest-head h3 { font-size: 17px; margin: 0; }
  .rank { color: var(--muted); font-size: 13px; }
  .score { min-width: 52px; text-align: center; background: var(--accent-soft); color: var(--accent); border-radius: 10px; padding: 4px 8px; font-weight: 700; }
  .score small { display: block; font-weight: 400; font-size: 11px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .tag.good { color: var(--ok); } .tag.bad { color: var(--danger); }
  .price { display: flex; justify-content: space-between; align-items: baseline; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; flex-wrap: wrap; gap: 4px; }
  .price b { font-size: 19px; }
  ul.list { margin: 0; padding-right: 18px; font-size: 13.5px; }
  ul.list.warn li { color: var(--warn); }
  details summary { cursor: pointer; color: var(--accent); font-size: 13.5px; }
  table.cost { width: 100%; font-size: 13px; border-collapse: collapse; margin-top: 6px; }
  table.cost td { padding: 3px 0; } table.cost td:last-child { text-align: left; }
  .day { border-right: 3px solid var(--accent-soft); padding: 2px 10px 6px; margin-top: 8px; font-size: 13.5px; }
  .day b { color: var(--accent); }
  .hidden { display: none !important; }
  .notes li { color: var(--muted); font-size: 13px; }
  @media (max-width: 640px) { .results { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><div class="wrap bar"><div class="logo">سفر<span>پلنر</span></div><span class="hint">پیشنهاد هوشمند مقصد و برنامه سفر داخلی و خارجی</span></div></header>

<main class="wrap">
  <form id="form" novalidate>
    <div class="card">
      <h2>۱. بودجه و زمان سفر</h2>
      <div class="grid">
        <div><label for="budget">بودجه کل سفر (تومان) *</label><input id="budget" type="text" inputmode="numeric" class="ltr" placeholder="100,000,000"></div>
        <div><label>تاریخ رفت *</label><div class="date" id="start"></div></div>
        <div><label>تاریخ برگشت *</label><div class="date" id="end"></div></div>
        <div><label for="usd_rate">نرخ دلار امروز (تومان) *</label><input id="usd_rate" type="text" inputmode="numeric" class="ltr"></div>
      </div>
      <p class="hint" id="duration"></p>
    </div>

    <div class="card">
      <h2>۲. همسفران</h2>
      <div class="grid">
        <div><label for="adults">بزرگسال</label><select id="adults"></select></div>
        <div><label for="children">کودک (زیر ۱۲ سال)</label><select id="children"></select></div>
      </div>
      <label class="gap">نوع سفر</label><div class="chips" id="traveler"></div>
    </div>

    <div class="card">
      <h2>۳. سلیقه شما</h2>
      <label>به چه چیزهایی علاقه دارید؟ (چند مورد)</label><div class="chips" id="interests"></div>
      <label class="gap">مقصد</label><div class="chips" id="scope"></div>
      <label class="gap">سطح رفاه</label><div class="chips" id="comfort"></div>
      <div class="grid gap">
        <div><label for="hours">حداکثر زمان مسیر</label>
          <select id="hours"><option value="">مهم نیست</option><option value="3">تا ۳ ساعت</option><option value="5">تا ۵ ساعت</option><option value="8">تا ۸ ساعت</option></select></div>
      </div>
      <div class="chips gap"><label class="chip"><input type="checkbox" id="visa_free"> فقط مقصدهای بدون ویزا یا با ویزای فرودگاهی</label></div>
      <div class="gap" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <button class="btn" id="submit">پیشنهاد سفر</button><span id="error" class="err"></span>
      </div>
    </div>
  </form>

  <section id="out" class="hidden"></section>
</main>

<script>
const $ = id => document.getElementById(id);
const fa = n => Number(n).toLocaleString('fa-IR');
const faDigits = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toLatin = s => s.replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const DAY_MS = 86400000;
let META = {}, DATA = null;

// --- Jalali dates via the browser's Persian calendar support -------------------------
const persianFmt = new Intl.DateTimeFormat('en-u-ca-persian-nu-latn', { timeZone: 'UTC', year: 'numeric', month: 'numeric', day: 'numeric' });
function toJalali(ms) {
  const p = Object.fromEntries(persianFmt.formatToParts(new Date(ms)).map(x => [x.type, x.value]));
  return [parseInt(p.year), parseInt(p.month), parseInt(p.day)];
}
function fromJalali(jy, jm, jd) {
  // Find 1 Farvardin near 20/21 March, then add the day offset and verify (catches 30 Esfand in non-leap years).
  let ms = Date.UTC(jy + 621, 2, 17);
  while (toJalali(ms)[1] !== 1 || toJalali(ms)[2] !== 1) ms += DAY_MS;
  ms += ((jm - 1) * 31 - Math.max(0, jm - 7) + jd - 1) * DAY_MS;
  const [y, m, d] = toJalali(ms);
  return y === jy && m === jm && d === jd ? ms : null;
}
const iso = ms => new Date(ms).toISOString().slice(0, 10);

function datePicker(id, ms) {
  const [y, m, d] = toJalali(ms);
  const years = [y - 1, y, y + 1, y + 2];
  $(id).innerHTML = `
    <select class="d">${Array.from({length: 31}, (_, i) => `<option value="${i + 1}">${faDigits(i + 1)}</option>`).join('')}</select>
    <select class="m">${MONTHS.map((n, i) => `<option value="${i + 1}">${n}</option>`).join('')}</select>
    <select class="y">${years.map(v => `<option value="${v}">${faDigits(v)}</option>`).join('')}</select>`;
  $(id).querySelector('.y').value = y; $(id).querySelector('.m').value = m; $(id).querySelector('.d').value = d;
  $(id).querySelectorAll('select').forEach(s => s.onchange = updateDuration);
}
function pickerValue(id) {
  const v = cls => Number($(id).querySelector(cls).value);
  return fromJalali(v('.y'), v('.m'), v('.d'));
}
function updateDuration() {
  const s = pickerValue('start'), e = pickerValue('end');
  if (!s || !e) { $('duration').textContent = 'تاریخ واردشده معتبر نیست.'; return; }
  const nights = Math.round((e - s) / DAY_MS);
  $('duration').textContent = nights > 0 ? `${fa(nights)} شب و ${fa(nights + 1)} روز` : 'تاریخ برگشت باید بعد از تاریخ رفت باشد.';
}

function chips(id, name, options, type, checked) {
  $(id).innerHTML = Object.entries(options).map(([k, v]) =>
    `<label class="chip"><input type="${type}" name="${name}" value="${k}" ${checked(k) ? 'checked' : ''}> ${esc(v)}</label>`).join('');
}
function money(el) {
  el.addEventListener('input', () => {
    const digits = toLatin(el.value).replace(/\D/g, '');
    el.value = digits ? Number(digits).toLocaleString('en-US') : '';
  });
}
const moneyValue = id => Number(toLatin($(id).value).replace(/\D/g, ''));

async function init() {
  META = await (await fetch('/api/meta')).json();
  const today = Date.UTC(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
  datePicker('start', today + 14 * DAY_MS);
  datePicker('end', today + 19 * DAY_MS);
  updateDuration();
  $('adults').innerHTML = Array.from({length: 20}, (_, i) => `<option value="${i + 1}">${fa(i + 1)}</option>`).join('');
  $('adults').value = 2;
  $('children').innerHTML = Array.from({length: 11}, (_, i) => `<option value="${i}">${fa(i)}</option>`).join('');
  chips('traveler', 'traveler', META.traveler_types, 'radio', k => k === 'couple');
  chips('interests', 'interests', META.interests, 'checkbox', () => false);
  chips('scope', 'scope', META.scopes, 'radio', k => k === 'both');
  chips('comfort', 'comfort', { auto: 'خودکار (بهترین سطح در بودجه)', ...META.comfort_levels }, 'radio', k => k === 'auto');
  $('usd_rate').value = META.default_usd_rate.toLocaleString('en-US');
  money($('budget')); money($('usd_rate'));
  $('children').onchange = () => {
    if (Number($('children').value) > 0) document.querySelector('input[name=traveler][value=family]').checked = true;
  };
}

$('form').onsubmit = async e => {
  e.preventDefault();
  $('error').textContent = '';
  const start = pickerValue('start'), end = pickerValue('end');
  const errors = [];
  if (!moneyValue('budget')) errors.push('بودجه را وارد کنید.');
  if (!moneyValue('usd_rate')) errors.push('نرخ دلار را وارد کنید.');
  if (!start || !end) errors.push('تاریخ‌ها معتبر نیستند.');
  else if (end <= start) errors.push('تاریخ برگشت باید بعد از تاریخ رفت باشد.');
  else if ((end - start) / DAY_MS > 30) errors.push('سفر حداکثر ۳۰ شب می‌تواند باشد.');
  if (errors.length) { $('error').textContent = errors.join('\n'); return; }

  const body = {
    budget: moneyValue('budget'), start_date: iso(start), end_date: iso(end),
    adults: Number($('adults').value), children: Number($('children').value),
    traveler_type: document.querySelector('input[name=traveler]:checked').value,
    interests: [...document.querySelectorAll('input[name=interests]:checked')].map(i => i.value),
    scope: document.querySelector('input[name=scope]:checked').value,
    comfort: document.querySelector('input[name=comfort]:checked').value,
    visa_free_only: $('visa_free').checked,
    max_travel_hours: $('hours').value ? Number($('hours').value) : null,
    usd_rate: moneyValue('usd_rate'),
  };
  $('submit').disabled = true; $('submit').textContent = 'در حال بررسی مقصدها...';
  try {
    const res = await fetch('/api/recommend', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) throw new Error(Array.isArray(data.detail) ? data.detail.map(d => d.msg).join('\n') : 'خطا در دریافت پیشنهادها');
    render(data);
  } catch (err) {
    $('error').textContent = err.message;
  } finally {
    $('submit').disabled = false; $('submit').textContent = 'پیشنهاد سفر';
  }
};

function render(data) {
  DATA = data;
  const excluded = Object.entries(data.excluded).map(([k, v]) => `${esc(k)}: ${fa(v)}`).join('، ');
  const hasDom = data.recommendations.some(r => r.scope === 'domestic');
  const hasInt = data.recommendations.some(r => r.scope === 'international');
  $('out').classList.remove('hidden');
  $('out').innerHTML = `
    <div class="card">
      <h2>پیشنهادهای سفر شما</h2>
      ${data.nowruz ? '<div class="banner">سفر شما با تعطیلات نوروز هم‌زمان است؛ قیمت‌ها حدود ۳۵٪ بالاتر محاسبه شده و باید زودتر رزرو کنید.</div>' : ''}
      <p class="hint">${fa(data.nights)} شب، ${fa(data.travelers)} نفر · از ${fa(data.considered)} مقصد بررسی‌شده، ${fa(data.recommendations.length)} مقصد مناسب پیدا شد.
        ${excluded ? '<br>کنار گذاشته‌شده‌ها — ' + excluded : ''}</p>
      ${data.recommendations.length ? `<div class="tabs" id="tabs">
        <button class="active" data-f="all">همه</button>
        ${hasDom ? '<button data-f="domestic">داخلی</button>' : ''}${hasInt ? '<button data-f="international">خارجی</button>' : ''}
      </div>` : noResults(data)}
      <div class="results" id="cards"></div>
      <ul class="notes gap">${data.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>
    </div>`;
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('active', x === b));
    renderCards(b.dataset.f);
  });
  renderCards('all');
  $('out').scrollIntoView({ behavior: 'smooth' });
}

function noResults(data) {
  const cheap = data.cheapest_excluded.map(c => `<li>${esc(c.name)} (${esc(c.country)}): حدود ${fa(c.total)} تومان</li>`).join('');
  return `<div class="banner">با این بودجه و شرایط مقصد مناسبی پیدا نشد. علایق یا فیلترها را کمتر کنید یا بودجه را افزایش دهید.</div>
    ${cheap ? `<p class="hint">ارزان‌ترین گزینه‌هایی که کمی از بودجه بیشتر بودند:</p><ul class="list">${cheap}</ul>` : ''}`;
}

function renderCards(filter) {
  const recs = DATA.recommendations.filter(r => filter === 'all' || r.scope === filter);
  $('cards').innerHTML = recs.map((r, i) => {
    const c = r.cost;
    const seasonCls = r.season_score >= 3.5 ? 'good' : r.season_score < 2.5 ? 'bad' : '';
    const visaCls = ['domestic', 'free', 'on_arrival'].includes(r.visa) ? 'good' : r.visa === 'embassy' ? 'bad' : '';
    return `<article class="dest">
      <div class="dest-head">
        <div><div class="rank">پیشنهاد ${fa(i + 1)} · ${esc(r.country)}</div><h3>${esc(r.name)}</h3></div>
        <div class="score">${fa(Math.round(r.score))}<small>امتیاز</small></div>
      </div>
      <div class="hint">${esc(r.summary)}</div>
      <div class="tags">
        <span class="tag">${r.scope === 'domestic' ? 'داخلی' : 'خارجی'}</span>
        <span class="tag ${seasonCls}">${esc(r.season_label)}</span>
        <span class="tag ${visaCls}">${esc(r.visa_label)}</span>
        <span class="tag">${esc(r.transport_label)} · حدود ${fa(r.travel_hours)} ساعت</span>
        <span class="tag">سطح ${esc(r.comfort_label)}</span>
      </div>
      <div class="price"><span class="hint">هزینه تخمینی کل</span><b>${fa(c.total)} <small class="hint">تومان</small></b>
        <span class="hint" style="width:100%">نفری حدود ${fa(c.per_person)} تومان · ${fa(c.rooms)} اتاق</span></div>
      <details><summary>جزئیات هزینه</summary>
        <table class="cost">
          <tr><td>رفت و برگشت</td><td>${fa(c.transport)}</td></tr>
          <tr><td>اقامت</td><td>${fa(c.lodging)}</td></tr>
          <tr><td>غذا، جابه‌جایی و تفریحات</td><td>${fa(c.daily)}</td></tr>
          ${c.visa ? `<tr><td>ویزا</td><td>${fa(c.visa)}</td></tr>` : ''}
          <tr><td>هزینه‌های پیش‌بینی‌نشده (۱۰٪)</td><td>${fa(c.contingency)}</td></tr>
        </table>
      </details>
      ${r.reasons.length ? `<ul class="list">${r.reasons.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      ${r.warnings.length ? `<ul class="list warn">${r.warnings.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      <div class="tags">${r.attractions.map(a => `<span class="tag">${esc(a)}</span>`).join('')}</div>
      <details><summary>برنامه روزبه‌روز</summary>
        ${r.itinerary.map(d => `<div class="day"><b>${esc(d.title)}</b> <span class="hint">${esc(d.date_label)}</span><br>${d.activities.map(esc).join(' · ')}</div>`).join('')}
      </details>
      ${r.tips.length ? `<div class="hint">💡 ${r.tips.map(esc).join(' ')}</div>` : ''}
    </article>`;
  }).join('');
}

init();
</script>
</body>
</html>
